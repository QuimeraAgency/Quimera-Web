<!doctype html>
<!-- @dsCard group="Type" name="Type — Emphasis" subtitle="Lavender colour shift, same weight — the only device" viewport="700x280" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
body { background: var(--ink-950); }
.frame { width: 700px; min-height: 280px; padding: 28px 32px; position: relative; color: var(--fg-1); }
.meta-tl { position: absolute; top: 12px; left: 32px; font-family: var(--font-title); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; opacity: 0.55; }
.row { display: grid; grid-template-columns: 1fr 140px; gap: 16px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); }
.row:last-child { border: 0; }
.row .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); text-align: right; line-height: 1.45; }
.row .meta strong { display: block; font-weight: 700; color: var(--fg-2); }
</style></head><body><div class="frame">
<div class="meta-tl">TYPE · EMPHASIS · 06</div>

  <div style="padding-top:18px">
    <div style="font-family:var(--font-title);font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-3);margin-bottom:24px;padding-bottom:10px;border-bottom:1px solid var(--rule)">Emphasis · lavender shift, same weight</div>
    <div style="font-family:var(--font-title);font-size:48px;font-weight:700;line-height:1.05;letter-spacing:-0.025em;color:var(--bone-50);max-width:600px;margin-bottom:24px">Authority is built, <span style="color:var(--lav-300)">not announced.</span></div>
    <div style="font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--fg-2);max-width:560px">The single emphasis device. Same Montserrat weight, colour shifts to Bebacc (#BEBACC). No italic, no weight bump. Use on one phrase per page maximum.</div>
  </div>

</div></body></html>
