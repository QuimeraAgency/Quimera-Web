<!doctype html>
<!-- @dsCard group="Brand" name="Brand — Mark Variants" subtitle="Five canonical mark variants" viewport="700x260" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
body { background: var(--ink-950); }
.frame { width: 700px; min-height: 260px; padding: 28px 32px; position: relative; color: var(--fg-1); }
.meta-tl { position: absolute; top: 12px; left: 32px; font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.42; }
.section-title { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.5; margin-bottom: 18px; }
.section-title.dark { color: var(--on-bone-3); opacity: 1; }
/* Button base */
.qbtn { font-family: var(--font-sans); font-size: 13px; font-weight: 500; letter-spacing: -0.005em;
  padding: 10px 20px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; transition: all 200ms cubic-bezier(0.22,0.61,0.36,1); display: inline-flex; align-items: center; gap: 8px; }
.qbtn-primary-dark { background: var(--bone-50); color: var(--ink-950); }
.qbtn-secondary-dark { background: transparent; color: var(--fg-1); border-color: var(--rule-strong); }
.qbtn-ghost-dark { background: transparent; color: var(--fg-1); border-color: transparent; }
.qbtn-primary-light { background: var(--ink-950); color: var(--bone-50); }
.qbtn-secondary-light { background: transparent; color: var(--on-bone-1); border-color: var(--rule-paper-strong); }
.qbtn-text { font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--fg-1); padding: 4px 0; border-bottom: 1px solid var(--rule-strong); }
.qbtn-text-light { font-family: var(--font-sans); font-size: 13px; font-weight: 500; color: var(--on-bone-1); padding: 4px 0; border-bottom: 1px solid var(--rule-paper-strong); }
/* Input */
.qinput { font-family: var(--font-sans); font-size: 14px; padding: 11px 14px; background: transparent;
  border: 1px solid var(--rule-paper-strong); border-radius: 6px; color: var(--on-bone-1); width: 100%; outline: none; }
.qinput:focus { border-color: var(--ink-950); }
.qlabel { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-bone-3); margin-bottom: 6px; display: block; }
/* Tag */
.qtag { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; color: var(--fg-2); }
.qtag.solid { background: var(--lav-300); color: var(--ink-950); border-color: var(--lav-300); }
.qtag.paper { color: var(--on-bone-2); border-color: var(--rule-paper-strong); }
/* Card */
.qcard { background: var(--bone-50); border: 1px solid var(--rule-paper); border-radius: 6px; padding: 24px; box-shadow: 0 1px 0 rgba(14,13,18,0.04), 0 1px 2px rgba(14,13,18,0.06); }
</style></head><body><div class="frame">
<div class="meta-tl">BRAND · MARKS · 01</div>

  <div class="section-title">Mark variants · 6 canonical</div>
  <div style="display:flex;gap:10px;align-items:center;margin-top:10px">
    <div style="background:var(--ink-950);border:1px solid var(--rule);width:96px;height:96px;display:flex;align-items:center;justify-content:center"><img src="../assets/quimera-mark-bebacc.svg" style="width:60px;height:60px"></div>
    <div style="background:var(--bone-50);border:1px solid var(--rule-paper);width:96px;height:96px;display:flex;align-items:center;justify-content:center"><img src="../assets/quimera-mark-bebacc-shadow.svg" style="width:62px;height:62px"></div>
    <div style="background:var(--ink-950);border:1px solid var(--rule);width:96px;height:96px;display:flex;align-items:center;justify-content:center"><img src="../assets/quimera-mark-white-on-black.svg" style="width:60px;height:60px"></div>
    <div style="background:var(--ink-950);border:1px solid var(--rule);width:96px;height:96px;display:flex;align-items:center;justify-content:center"><img src="../assets/quimera-mark-outline-white.svg" style="width:60px;height:60px"></div>
    <div style="background:var(--bone-50);border:1px solid var(--rule-paper);width:96px;height:96px;display:flex;align-items:center;justify-content:center"><img src="../assets/quimera-mark-black-on-white.svg" style="width:60px;height:60px"></div>
    <div style="background:var(--bone-50);border:1px solid var(--rule-paper);width:96px;height:96px;display:flex;align-items:center;justify-content:center"><img src="../assets/quimera-mark-outline-black.svg" style="width:60px;height:60px"></div>
  </div>
  <div style="font-family:var(--font-title);font-size:9px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--fg-3);margin-top:14px;display:flex;gap:10px">
    <span style="width:96px;text-align:center">Bebacc</span>
    <span style="width:96px;text-align:center">Bebacc · 3D</span>
    <span style="width:96px;text-align:center">Bone fill</span>
    <span style="width:96px;text-align:center">Outline</span>
    <span style="width:96px;text-align:center">Ink fill</span>
    <span style="width:96px;text-align:center">Outline</span>
  </div>

</div></body></html>
