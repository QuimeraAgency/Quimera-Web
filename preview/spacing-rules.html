<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing — Hairline Rules" subtitle="1px rules on dark and paper" viewport="700x320" -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
<style>
body { background: var(--ink-950); }
.frame { width: 700px; min-height: 320px; padding: 28px 32px; position: relative; color: var(--fg-1); }

<body><div class="frame">
<div class="meta-tl">SPACING · RULES · 04</div>

  <div style="padding-top:14px">
    <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;opacity:0.5;margin-bottom:18px">Hairline Rules · 1px only</div>
    <div style="display:flex;flex-direction:column;gap:18px">
      <div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-bottom:8px">rule · 1px / rgba(190,186,204,0.14)</div>
        <div style="height:1px;background:var(--rule)"></div>
      </div>
      <div>
        <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3);margin-bottom:8px">rule-strong · 1px / rgba(190,186,204,0.28)</div>
        <div style="height:1px;background:var(--rule-strong)"></div>
      </div>
      <div style="background:var(--bone-50);color:var(--on-bone-1);padding:14px 16px;border-radius:2px">

        <div style="font-family:var(--font-mono);font-size:10px;color:var(--on-bone-3);margin:12px 0 8px">rule-paper-strong · 1px / rgba(14,13,18,0.22)</div>
        <div style="height:1px;background:var(--rule-paper-strong)"></div>
      </div>
    </div>
  </div>
